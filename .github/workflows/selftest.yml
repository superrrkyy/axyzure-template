name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Uji template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pasang PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Jalankan selftest
        run: bash scripts/selftest.sh
